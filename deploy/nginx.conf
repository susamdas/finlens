# Self-hosting FinLens with nginx (used by the Dockerfile). Keep headers in sync with public/_headers.
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_types application/json application/javascript text/css image/svg+xml text/plain;

  # Security headers: deploy/finlens-security.conf, included in every location because nginx
  # ignores server-level add_header in any location that sets its own.

  location /assets/ {
    include /etc/nginx/snippets/finlens-security.conf;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location = /data/processed/meta.json {
    include /etc/nginx/snippets/finlens-security.conf;
    add_header Cache-Control "no-cache";
  }

  location /data/ {
    include /etc/nginx/snippets/finlens-security.conf;
    add_header Cache-Control "public, max-age=86400, stale-while-revalidate=604800";
    try_files $uri =404;
  }

  location ~ ^/(geo|flags)/ {
    include /etc/nginx/snippets/finlens-security.conf;
    add_header Cache-Control "public, max-age=604800";
    try_files $uri =404;
  }

  # Single-page app: every other path serves index.html; the app shows its own 404 page.
  location / {
    include /etc/nginx/snippets/finlens-security.conf;
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
